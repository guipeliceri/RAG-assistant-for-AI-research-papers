name: deploy space

# Pushes the app to the Hugging Face Space whenever main changes.
on:
  push:
    branches: [main]
    paths: ["app.py", "src/**", "requirements.txt", "Dockerfile", "space/**"]
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface-hub==2.3.0
      - name: Check configuration
        run: |
          test -n "$HF_TOKEN" || { echo "::error::secret HF_TOKEN is not set"; exit 1; }
          test -n "$HF_SPACE_REPO" || { echo "::error::variable HF_SPACE_REPO is not set"; exit 1; }
          test -n "$HF_DATASET_REPO" || { echo "::error::variable HF_DATASET_REPO is not set"; exit 1; }
      - name: Upload to the Space
        run: |
          mkdir -p /tmp/space
          cp -r app.py src requirements.txt Dockerfile .dockerignore /tmp/space/
          cp space/README.md /tmp/space/README.md
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi()
          repo = os.environ["HF_SPACE_REPO"]
          api.create_repo(repo, repo_type="space", space_sdk="docker", exist_ok=True)
          # The app reads its data from this Dataset at startup.
          api.add_space_variable(repo, "HF_DATASET_REPO", os.environ["HF_DATASET_REPO"])
          api.upload_folder(
              folder_path="/tmp/space",
              repo_id=repo,
              repo_type="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              ignore_patterns=["**/__pycache__/**"],
          )
          print(f"https://huggingface.co/spaces/{repo}")
          PY
