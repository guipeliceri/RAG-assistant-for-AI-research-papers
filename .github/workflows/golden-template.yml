name: golden template

# One-off: samples 30 papers into eval/golden.csv for hand labelling.
on: workflow_dispatch

permissions:
  contents: write

env:
  PYTHONPATH: src
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m rag_papers.hub pull
      - run: python -m rag_papers.evaluate golden-template
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/golden.csv
          git commit -m "Add golden set template (30 papers to label)"
          git push
